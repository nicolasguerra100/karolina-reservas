<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validar abono · Karolina Niño · Spa de Uñas</title>
<meta name="theme-color" content="#6E4A8E">
<link rel="icon" href="logo.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c:#7C3AED;--c2:#F3EEFF;--tx:#1f2430;--mu:#6b7280;--ln:#e7e7ee;--bg:#f6f6f9;--ok:#16a34a;--er:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx)}
.top{background:var(--c);color:#fff;padding:22px 16px 64px;text-align:center}
.top b{font-size:18px}
.top div{opacity:.85;font-size:14px;margin-top:2px}
.wrap{max-width:620px;margin:-44px auto 40px;padding:0 16px}
.card{background:#fff;border-radius:20px;box-shadow:0 12px 34px rgba(20,20,45,.09);padding:22px 20px}
h1{font-size:21px;margin:0 0 4px}
.estado{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.05em;padding:5px 10px;border-radius:99px;margin-bottom:14px}
.PENDIENTE{background:#fef3c7;color:#92400e}.CONFIRMADA{background:#dcfce7;color:#166534}
.RECHAZADA{background:#fee2e2;color:#991b1b}.VENCIDA{background:#e5e7eb;color:#374151}
.monto{background:var(--c2);border-radius:15px;padding:14px;text-align:center;margin:6px 0 16px}
.monto span{font-size:13px;color:var(--mu)}
.monto b{display:block;font-size:30px;color:var(--c)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:9px 0;border-top:1px solid var(--ln);vertical-align:top}
td:first-child{color:var(--mu);width:38%}
td:last-child{font-weight:600;word-break:break-word}
a{color:var(--c)}
.soporte{margin-top:18px}
.soporte img{width:100%;border-radius:12px;border:1px solid var(--ln);display:block}
.acciones{display:flex;gap:10px;margin-top:22px;position:sticky;bottom:12px}
.btn{flex:1;border:0;border-radius:13px;font:inherit;font-weight:700;font-size:16px;padding:15px;cursor:pointer;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.si{background:var(--ok)}
.no{background:#fff;color:var(--er);border:1.5px solid var(--er);flex:0 0 34%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{border-radius:13px;padding:14px 16px;margin-top:16px;font-weight:600}
.msg.bien{background:#dcfce7;color:#166534}.msg.mal{background:#fee2e2;color:#991b1b}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><b id="negocio"></b><div>Validación de abono</div></header>
<main class="wrap"><div class="card" id="contenido"><p>Cargando la reserva…</p></div></main>

<script src="api.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// D llega incrustada por Apps Script o pedida por el sitio en GitHub Pages
function arrancar(D) {
document.documentElement.style.setProperty('--c', D.color);
document.documentElement.style.setProperty('--c2', D.suave);
$('negocio').textContent = D.negocio;

if (!D.valido) {
  $('contenido').innerHTML = '<h1>Enlace no válido</h1><p>Este enlace no corresponde a ninguna reserva. Ábrelo directamente desde el correo de notificación.</p>';
} else {
  const r = D.reserva;
  const tel = r.celular.replace(/\D/g, '');
  // URL entre comillas simples: Apps Script corta los "//" dentro de plantillas con acento grave
  const waCliente = 'https://wa.me/' + (tel.length === 10 ? '57' + tel : tel);
  const filas = [
    ['Cliente', esc(r.nombre)],
    ['Celular', `<a href="${waCliente}" target="_blank">${esc(r.celular)}</a>`],
    ['Correo', `<a href="mailto:${esc(r.correo)}">${esc(r.correo)}</a>`],
    ['Servicio', esc(r.servicio)],
    ['Fecha', esc(r.fecha)],
    ['Hora', esc(r.hora) + ` · ${esc(r.duracion)} min`],
    ['Valor del servicio', esc(r.precio)],
  ];
  Object.keys(r.extras).forEach(k => filas.push([esc(k), esc(r.extras[k])]));
  if (r.notas) filas.push(['Notas', esc(r.notas)]);
  filas.push(['Código', esc(r.id)]);

  $('contenido').innerHTML = `
    <h1>Reserva de ${esc(r.nombre.split(' ')[0])}</h1>
    <span class="estado ${esc(r.estado)}" id="estado">${esc(r.estado)}</span>
    <div class="monto"><span>Verifica que te llegó este abono</span><b>${esc(r.abono)}</b></div>
    <table>${filas.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>
    <div class="soporte">
      <p style="font-weight:700;margin:0 0 8px">Soporte de pago</p>
      ${r.soporteImg ? `<img src="${r.soporteImg}" alt="Soporte de pago">` : ''}
      <p style="font-size:13px;margin:8px 0 0"><a href="${esc(r.soporteUrl)}" target="_blank">Abrir el soporte en Google Drive</a></p>
    </div>
    <div class="msg" id="msg" hidden></div>
    <div class="acciones" id="acciones">
      <button class="btn no" data-accion="rechazar">Rechazar</button>
      <button class="btn si" data-accion="confirmar">✓ Confirmar pago</button>
    </div>`;

  const finales = ['CONFIRMADA', 'RECHAZADA'];
  if (finales.includes(r.estado)) $('acciones').hidden = true;
  if (r.estado === 'VENCIDA') mostrar('Esta reserva venció sin confirmarse. Si el abono sí llegó, todavía puedes confirmarla si el horario sigue libre.', false);

  document.querySelectorAll('[data-accion]').forEach(b => b.addEventListener('click', () => {
    const accion = b.dataset.accion;
    if (accion === 'rechazar' && !confirm('¿Rechazar esta reserva? Se liberará el horario y se le avisará al cliente.')) return;
    document.querySelectorAll('[data-accion]').forEach(x => (x.disabled = true));
    b.textContent = accion === 'confirmar' ? 'Confirmando…' : 'Rechazando…';
    google.script.run
      .withSuccessHandler(res => {
        mostrar(res.mensaje, res.ok);
        if (res.estado) { $('estado').textContent = res.estado; $('estado').className = 'estado ' + res.estado; }
        if (res.ok) $('acciones').hidden = true;
        else reactivar();
      })
      .withFailureHandler(err => { mostrar('Error: ' + err.message, false); reactivar(); })
      .gestionarReserva(D.id, D.token, accion);
  }));
}
}

function mostrar(texto, bien) {
  const m = $('msg');
  m.textContent = texto;
  m.className = 'msg ' + (bien ? 'bien' : 'mal');
  m.hidden = false;
}
function reactivar() {
  document.querySelectorAll('[data-accion]').forEach(x => (x.disabled = false));
  document.querySelector('.no').textContent = 'Rechazar';
  document.querySelector('.si').textContent = '✓ Confirmar pago';
}
(() => {
  const q = new URLSearchParams(location.search);
  google.script.run
    .withSuccessHandler(arrancar)
    .withFailureHandler(() => { $('contenido').innerHTML = '<p>No pudimos cargar la reserva. Revisa tu conexión y recarga la página.</p>'; })
    .verReserva(q.get('r') || '', q.get('t') || '');
})();
</script>
</body>
</html>
