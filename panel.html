<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis reservas · Karolina Niño</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6E4A8E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis reservas">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c:#6E4A8E;--c2:#F6F0F9;--ac:#B8963E;--tx:#1f2430;--mu:#6b7280;--ln:#e7e7ee;--bg:#f6f6f9;--ok:#15803d;--okbg:#dcfce7;--er:#dc2626;--erbg:#fee2e2;--wa:#b45309;--wabg:#fef3c7}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.top{background:#fff;border-bottom:3px solid var(--ac);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.top img{height:44px;width:auto}
.top h1{font-size:19px;margin:0;flex:1}
.icono{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--ln);background:#fff;cursor:pointer;font-size:19px;display:grid;place-items:center}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h2{font-size:15px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--wabg);color:var(--wa);font-size:12px;padding:2px 9px;border-radius:99px}
.tarjeta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.tarjeta:active{transform:scale(.99)}
.punto{width:12px;height:12px;border-radius:50%;background:#f59e0b;flex:0 0 auto}
.tarjeta .info{flex:1;min-width:0}
.tarjeta b{display:block;font-size:16px}
.tarjeta small{color:var(--mu);font-size:13px}
.tarjeta .monto{font-weight:800;color:var(--c);white-space:nowrap}
.dia{font-size:13px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px}
.cita{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--ln);border-radius:12px;padding:11px 14px;margin-bottom:6px;font-size:14px}
.cita .h{font-weight:800;color:var(--c);min-width:78px}
.cita small{display:block;color:var(--mu)}
.vacio{background:#fff;border:1.5px dashed var(--ln);border-radius:16px;padding:20px;text-align:center;color:var(--mu);font-size:14px}
.det{background:#fff;border-radius:20px;padding:18px;border:1px solid var(--ln)}
.det h3{font-size:20px;margin:0 0 4px}
.estado{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--wabg);color:var(--wa)}
.estado.CONFIRMADA{background:var(--okbg);color:var(--ok)}.estado.RECHAZADA,.estado.CANCELADA{background:var(--erbg);color:var(--er)}.estado.VENCIDA{background:#e5e7eb;color:#374151}
.caja{background:var(--c2);border-radius:14px;padding:14px;text-align:center;margin:14px 0}
.caja span{font-size:13px;color:var(--mu)}
.caja b{display:block;font-size:30px;color:var(--c)}
.foto{width:100%;border-radius:14px;border:1px solid var(--ln);display:block;margin:6px 0 4px}
.cargandoFoto{height:180px;border-radius:14px;background:var(--bg);display:grid;place-items:center;color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
td{padding:9px 0;border-top:1px solid var(--ln);vertical-align:top}
td:first-child{color:var(--mu);width:36%}
td:last-child{font-weight:600;word-break:break-word}
a{color:var(--c)}
.acciones{display:flex;gap:10px;position:sticky;bottom:12px;margin-top:16px}
.btn{flex:1;height:54px;border-radius:14px;border:0;font-size:16px;font-weight:700;cursor:pointer}
.si{background:var(--ok);color:#fff}
.no{background:#fff;color:var(--er);border:1.5px solid var(--er);flex:0 0 36%}
.btn:disabled{opacity:.5}
.volver{background:none;border:0;color:var(--mu);padding:4px 0 12px;cursor:pointer;font-size:15px}
.aviso{position:fixed;left:16px;right:16px;bottom:20px;max-width:528px;margin:0 auto;background:var(--tx);color:#fff;padding:14px 16px;border-radius:14px;font-size:14px;z-index:9}
.girando{animation:g .8s linear infinite;display:inline-block}
@keyframes g{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top">
  <img src="logo.png" alt="Karolina Niño · Spa de Uñas">
  <h1>Mis reservas</h1>
  <button class="icono" id="recargar" aria-label="Actualizar">↻</button>
</header>

<main class="wrap">
  <section id="lista">
    <h2>Por validar <span class="n" id="nPend">…</span></h2>
    <div id="pendientes"><div class="vacio">Cargando…</div></div>
    <h2>Próximas citas</h2>
    <div id="proximas"></div>
  </section>

  <section id="detalle" hidden>
    <button class="volver" id="cerrar">← Volver</button>
    <div class="det" id="fichaDetalle"></div>
  </section>
</main>
<div class="aviso" id="aviso" hidden></div>

<script src="api.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pedir = (fn, ...args) => new Promise((ok, mal) => google.script.run.withSuccessHandler(ok).withFailureHandler(mal)[fn](...args));

// La clave llega en el enlace del correo; se guarda para abrir el panel desde la pantalla de inicio
let clave = new URLSearchParams(location.search).get('k') || '';
try {
  if (clave) localStorage.setItem('panelClave', clave);
  else clave = localStorage.getItem('panelClave') || '';
} catch (e) { /* sin almacenamiento local */ }

function avisar(texto) {
  const a = $('aviso');
  a.textContent = texto;
  a.hidden = false;
  clearTimeout(avisar.t);
  avisar.t = setTimeout(() => (a.hidden = true), 3500);
}

async function cargarLista() {
  $('recargar').innerHTML = '<span class="girando">↻</span>';
  try {
    const d = await pedir('listarPanel', clave);
    if (!d.ok) throw new Error(d.error);
    document.documentElement.style.setProperty('--c', d.color);
    document.documentElement.style.setProperty('--c2', d.suave);
    $('nPend').textContent = d.pendientes.length;
    $('pendientes').innerHTML = d.pendientes.length ? d.pendientes.map(r => `
      <button class="tarjeta" data-id="${esc(r.id)}">
        <span class="punto"></span>
        <span class="info"><b>${esc(r.nombre)}</b><small>${esc(r.servicio)} · ${esc(r.fechaTxt)}, ${esc(r.horaTxt)}</small></span>
        <span class="monto">${esc(r.abono)}</span>
      </button>`).join('') : '<div class="vacio">Todo al día. No hay abonos por validar.</div>';
    let ultimoDia = '';
    $('proximas').innerHTML = d.proximas.length ? d.proximas.map(r => {
      const cab = r.fecha !== ultimoDia ? `<div class="dia">${esc(r.fechaTxt)}</div>` : '';
      ultimoDia = r.fecha;
      return cab + `<div class="cita"><span class="h">${esc(r.horaTxt)}</span><span><b>${esc(r.nombre)}</b><small>${esc(r.servicio)}</small></span></div>`;
    }).join('') : '<div class="vacio">Aún no hay citas confirmadas.</div>';
  } catch (e) {
    $('nPend').textContent = '!';
    $('pendientes').innerHTML = `<div class="vacio">${esc(e.message || 'No pudimos cargar tus reservas. Revisa tu conexión.')}</div>`;
    $('proximas').innerHTML = '';
  }
  $('recargar').textContent = '↻';
}

async function abrir(id) {
  $('lista').hidden = true;
  $('detalle').hidden = false;
  window.scrollTo(0, 0);
  $('fichaDetalle').innerHTML = '<div class="cargandoFoto">Cargando la reserva…</div>';
  try {
    const d = await pedir('verReservaPanel', clave, id);
    if (!d.ok) throw new Error(d.error);
    const r = d.reserva;
    const tel = r.celular.replace(/\D/g, '');
    const filas = [
      ['Celular', `<a href="https://wa.me/${tel.length === 10 ? '57' + tel : tel}" target="_blank" rel="noopener">${esc(r.celular)} · WhatsApp</a>`],
      ['Correo', `<a href="mailto:${esc(r.correo)}">${esc(r.correo)}</a>`],
      ['Servicio', esc(r.servicio)],
      ['Fecha', esc(r.fecha)],
      ['Hora', `${esc(r.hora)} · ${esc(r.duracion)} min`],
      ['Valor', esc(r.precio)],
    ];
    Object.keys(r.extras).forEach(k => filas.push([esc(k), esc(r.extras[k])]));
    if (r.notas) filas.push(['Notas', esc(r.notas)]);
    filas.push(['Código', esc(r.id)]);
    const activa = r.estado === 'PENDIENTE' || r.estado === 'VENCIDA';
    $('fichaDetalle').innerHTML = `
      <h3>${esc(r.nombre)}</h3>
      <span class="estado ${esc(r.estado)}" id="estadoDet">${esc(r.estado)}</span>
      <div class="caja"><span>¿Te llegó este abono?</span><b>${esc(r.abono)}</b></div>
      ${r.soporteImg ? `<img class="foto" src="${r.soporteImg}" alt="Comprobante de pago">` : `<p><a href="${esc(r.soporteUrl)}" target="_blank" rel="noopener">Abrir el comprobante (PDF)</a></p>`}
      <table>${filas.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table>
      <div class="acciones" id="acciones" ${activa ? '' : 'hidden'}>
        <button class="btn no" data-accion="rechazar">Rechazar</button>
        <button class="btn si" data-accion="confirmar">✓ Confirmar pago</button>
      </div>`;
    document.querySelectorAll('[data-accion]').forEach(b => b.addEventListener('click', () => accion(r, b.dataset.accion)));
  } catch (e) {
    $('fichaDetalle').innerHTML = `<p>${esc(e.message || 'No pudimos cargar la reserva.')}</p>`;
  }
}

async function accion(r, accion) {
  if (accion === 'rechazar' && !confirm(`¿Rechazar la reserva de ${r.nombre}? El horario quedará libre y le avisaremos.`)) return;
  const botones = document.querySelectorAll('[data-accion]');
  botones.forEach(b => (b.disabled = true));
  try {
    const res = await pedir('accionPanel', clave, r.id, accion);
    avisar(res.mensaje);
    if (res.ok) { cerrar(); return; }
  } catch (e) {
    avisar('No se pudo completar. Revisa tu conexión e intenta de nuevo.');
  }
  botones.forEach(b => (b.disabled = false));
}

function cerrar() {
  $('detalle').hidden = true;
  $('lista').hidden = false;
  cargarLista();
}

$('pendientes').addEventListener('click', e => {
  const t = e.target.closest('.tarjeta');
  if (t) abrir(t.dataset.id);
});
$('cerrar').addEventListener('click', cerrar);
$('recargar').addEventListener('click', cargarLista);

if (!clave) {
  $('nPend').textContent = '!';
  $('pendientes').innerHTML = '<div class="vacio">Abre el panel desde el enlace "Ver todas mis reservas" de un correo de reservas.</div>';
} else {
  cargarLista();
}
</script>
</body>
</html>
